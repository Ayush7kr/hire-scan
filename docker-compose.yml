# ==============================================================================
# HireScan — Production Multi-Container Compose Configuration
# ==============================================================================

version: '3.8'

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: hirescan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hirescan_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hirescan_secure_db_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hirescan_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-hirescan_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Django Application (Gunicorn) ──────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hirescan_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-hirescan_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-hirescan_secure_db_pass_2026}
      USE_X_FORWARDED_HOST: "True"
      USE_X_FORWARDED_PORT: "True"
    volumes:
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
    networks:
      - hirescan_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Nginx Reverse Proxy & Static File Server ──────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: hirescan_nginx
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - staticfiles_data:/staticfiles:ro
      - media_data:/media:ro
    networks:
      - hirescan_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: hirescan_postgres_data
  staticfiles_data:
    name: hirescan_staticfiles_data
  media_data:
    name: hirescan_media_data

networks:
  hirescan_net:
    name: hirescan_network
    driver: bridge
